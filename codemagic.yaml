workflows:
  ios_build:
    name: SNG Trust iOS Build
    working_directory: src
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install CocoaPods
        script: pod install

      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace "SNG Trust.xcworkspace" \
            -scheme "SNG Trust" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
