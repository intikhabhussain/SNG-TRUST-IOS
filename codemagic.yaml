workflows:
  sng_trust_app_store:
    name: SNG Trust App Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shaheednazirghulamtrust.app
      vars:
        XCODE_WORKSPACE: "SNG Trust.xcworkspace"
        XCODE_SCHEME: "SNG Trust"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/src"
          if [ -f Podfile ]; then
            pod install
          fi

      - name: Set version 2.0
        script: |
          set -e
          cd "$CM_BUILD_DIR/src"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("SNG Trust.xcodeproj/project.pbxproj")
          s = p.read_text()
          s = re.sub(
              r"MARKETING_VERSION\s*=\s*[^;]+;",
              "MARKETING_VERSION = 2.0;",
              s
          )
          p.write_text(s)
          PY

      - name: Set up code signing
        script: |
          set -e
          cd "$CM_BUILD_DIR/src"
          xcode-project use-profiles

      - name: Validate export options
        script: |
          set -e
          plutil -lint "$HOME/export_options.plist"

      - name: Build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/src"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
