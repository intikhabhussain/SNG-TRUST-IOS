workflows:
  sng_trust_app_store:
    name: SNG Trust App Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shaheednazirghulamtrust.app

      vars:
        XCODE_WORKSPACE: "SNG Trust.xcworkspace"
        XCODE_SCHEME: "SNG Trust"

      xcode: latest
      cocoapods: default

    scripts:
      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/src"
          pod install

      - name: Configure code signing
        script: |
          cd "$CM_BUILD_DIR/src"
          xcode-project use-profiles

      - name: Build App Store IPA
        script: |
          cd "$CM_BUILD_DIR/src"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
