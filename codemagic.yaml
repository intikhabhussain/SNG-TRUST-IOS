workflows:
  sng_trust_app_store:
    name: SNG Trust App Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shaheednazirghulamtrust.app
      vars:
        XCODE_WORKSPACE: "SNG Trust.xcworkspace"
        XCODE_SCHEME: "SNG Trust"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/src"
          pod install

      - name: Configure iOS signing
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Verify workspace
        script: |
          set -e
          test -d "$CM_BUILD_DIR/src/$XCODE_WORKSPACE"
          xcodebuild -list \
            -workspace "$CM_BUILD_DIR/src/$XCODE_WORKSPACE"

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
