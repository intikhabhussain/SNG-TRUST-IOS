workflows:
  sng_trust_app_store:
    name: SNG Trust App Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shaheednazirghulamtrust.app

      vars:
        XCODE_WORKSPACE: "SNG Trust.xcworkspace"
        XCODE_SCHEME: "SNG Trust"

      xcode: latest
      cocoapods: default

    scripts:
      - name: Fix iOS capabilities
        script: |
          cd "$CM_BUILD_DIR/src"

          python3 <<'PY'
          import plistlib
          import pathlib
          import re

          ent = pathlib.Path("SNG Trust/Entitlements/Entitlements.plist")

          if ent.exists():
              with ent.open("rb") as f:
                  data = plistlib.load(f)

              remove_keys = [
                  "aps-environment",
                  "com.apple.developer.associated-domains",
                  "com.apple.security.app-sandbox",
                  "com.apple.security.device.audio-input",
                  "com.apple.security.device.camera",
                  "com.apple.security.files.user-selected.read-write",
                  "com.apple.security.network.client",
                  "com.apple.security.personal-information.location",
                  "com.apple.security.print",
              ]

              for key in remove_keys:
                  data.pop(key, None)

              with ent.open("wb") as f:
                  plistlib.dump(data, f)

          pbx = pathlib.Path("SNG Trust.xcodeproj/project.pbxproj")

          if pbx.exists():
              text = pbx.read_text()

              text = re.sub(
                  r'com\.apple\.AssociatedDomains\s*=\s*\{[^}]*\};',
                  '',
                  text
              )

              text = re.sub(
                  r'com\.apple\.Push\s*=\s*\{[^}]*\};',
                  '',
                  text
              )

              pbx.write_text(text)
          PY

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/src"
          pod install

      - name: Configure code signing
        script: |
          cd "$CM_BUILD_DIR/src"
          xcode-project use-profiles

      - name: Build App Store IPA
        script: |
          cd "$CM_BUILD_DIR/src"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
