workflows:
  sng_trust_app_store:
    name: SNG Trust App Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shaheednazirghulamtrust.app
      vars:
        XCODE_WORKSPACE: "SNG Trust.xcworkspace"
        XCODE_SCHEME: "SNG Trust"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/src"
          pod install

      - name: Configure iOS signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Verify export options
        script: |
          set -e
          plutil -lint /Users/builder/export_options.plist

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/SNG Trust.xcworkspace" \
            --scheme "SNG Trust" \
            --export-options-plist "/Users/builder/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
