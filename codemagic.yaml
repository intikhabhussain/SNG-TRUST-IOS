
workflows:
  sng_trust_app_store:
    name: SNG Trust App Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shaheednazirghulamtrust.app
      vars:
        XCODE_WORKSPACE: "SNG Trust.xcworkspace"
        XCODE_SCHEME: "SNG Trust"
      xcode: latest

    scripts:
      - name: Find Xcode workspace
        script: |
          find "$CM_BUILD_DIR" -name "*.xcworkspace"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/SNG Trust.xcworkspace" \
            --scheme "SNG Trust"

    artifacts:
      - build/ios/ipa/*.ipa
